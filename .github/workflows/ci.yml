name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  zones:
    # Every figure takes "today" as the local calendar day of its clock, and the runner's own
    # zone is UTC, where that day and the UTC one never differ. The whole suite again, side by
    # side with the check above, at both ends of the clock: there a day taken in UTC, or a test
    # that expects one, is a day off.
    strategy:
      fail-fast: false
      matrix:
        tz: [Pacific/Kiritimati, Pacific/Pago_Pago]
    name: pytest (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  apple:
    # The Mac app (apple/README.md): its Swift core, the Python engine it carries, and the app
    # itself, in the configuration that ships as well as the one tests run in.
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: brew install xcodegen
      - name: Swift core
        run: swift test --package-path apple/HearthKit
      - name: The engine stands on its own
        run: |
          apple/scripts/bundle-engine.sh "$RUNNER_TEMP/engine"
          "$RUNNER_TEMP/engine/python/bin/python3.14" -I apple/scripts/check-engine.py "$RUNNER_TEMP/engine"
      - name: Generate the project
        run: xcodegen generate --spec apple/project.yml
      - name: Build what ships
        run: >
          xcodebuild build -project apple/Hearth.xcodeproj -scheme Hearth -configuration Release
          -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO
      - name: An invented household on disk, for the app to open
        run: |
          password=$(openssl rand -hex 16)
          echo "::add-mask::$password"
          echo "HEARTH_FIXTURE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "HEARTH_FIXTURE_DATA_DIR=$RUNNER_TEMP/household" >> "$GITHUB_ENV"
      - run: uv run python -m tests.native.on_disk "$HEARTH_FIXTURE_DATA_DIR"
      - name: Another, with the ledger it kept before hearth beside it, for the app to bring in
        run: |
          echo "HEARTH_FIXTURE_LEDGER_DATA_DIR=$RUNNER_TEMP/ledger-household" >> "$GITHUB_ENV"
          ledger=$(uv run python -m tests.native.on_disk "$RUNNER_TEMP/ledger-household" --ledger "$RUNNER_TEMP/kept-ledger")
          echo "HEARTH_FIXTURE_LEDGER=$ledger" >> "$GITHUB_ENV"
      - name: The app shows net worth from the engine it carries, for the sample and a household
        # xcodebuild hands a TEST_RUNNER_ variable to the tests without its prefix.
        env:
          TEST_RUNNER_HEARTH_FIXTURE_DATA_DIR: ${{ env.HEARTH_FIXTURE_DATA_DIR }}
          TEST_RUNNER_HEARTH_FIXTURE_PASSWORD: ${{ env.HEARTH_FIXTURE_PASSWORD }}
          TEST_RUNNER_HEARTH_FIXTURE_LEDGER_DATA_DIR: ${{ env.HEARTH_FIXTURE_LEDGER_DATA_DIR }}
          TEST_RUNNER_HEARTH_FIXTURE_LEDGER: ${{ env.HEARTH_FIXTURE_LEDGER }}
        run: >
          xcodebuild test -project apple/Hearth.xcodeproj -scheme HearthUI
          -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=
