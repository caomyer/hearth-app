{% extends "base.html" %}
{% block title %}Form expired{% endblock %}
{% block content %}
  <div class="alert alert-warn" role="alert" style="margin-top: var(--s-8)">
    <svg aria-hidden="true"><use href="#i-clock"/></svg>
    <div class="alert-body">
      <p style="color: var(--ink); font-weight: 600">This form has expired.</p>
      <p>Reload the page and try again. <a href="/">Go to the household</a></p>
    </div>
  </div>
{% endblock %}
