{% extends "base.html" %}
{% block title %}Something went wrong{% endblock %}
{% block content %}
  <div class="alert alert-err" role="alert" style="margin-top: var(--s-8)">
    <svg aria-hidden="true"><use href="#i-error"/></svg>
    <div class="alert-body">
      <p style="color: var(--ink); font-weight: 600">That did not work.</p>
      <p>The request could not be completed. Go back and try again. <a href="/">Go to the household</a></p>
    </div>
  </div>
{% endblock %}
